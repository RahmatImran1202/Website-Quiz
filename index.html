<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Pengetahuan Umum</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navbar Bootstrap -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Kuis Pengetahuan Umum</span>
            <span class="navbar-text text-white" id="userNameDisplay"></span>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-10 col-lg-8">
                    <div class="card quiz-card">
                        <div class="card-body">
                            
                            <!-- Welcome Screen dengan Form -->
                            <section id="welcomeScreen" class="screen active">
                                <header class="text-center mb-4">
                                    <h1 class="title">Kuis Pengetahuan Umum</h1>
                                    <p class="subtitle">10 Soal Random dari 20 Soal</p>
                                </header>
                                
                                <form id="nameForm" class="needs-validation" novalidate>
                                    <div class="mb-3">
                                        <label for="userName" class="form-label">Masukkan Nama Anda</label>
                                        <input type="text" class="form-control" id="userName" placeholder="Nama lengkap" required minlength="3">
                                        <div class="invalid-feedback">
                                            Nama harus diisi minimal 3 karakter
                                        </div>
                                    </div>
                                    <button type="submit" class="btn btn-dark btn-lg w-100">Mulai Kuis</button>
                                </form>
                            </section>

                            <!-- Quiz Screen -->
                            <section id="quizScreen" class="screen">
                                <div class="progress mb-3" style="height: 6px;">
                                    <div id="progressFill" class="progress-bar bg-dark" role="progressbar" style="width: 0%"></div>
                                </div>
                                
                                <div class="question-counter text-center mb-4">
                                    Soal <span id="currentQuestion">1</span> / <span id="totalQuestions">10</span>
                                </div>
                                
                                <div class="question-box mb-4">
                                    <h2 id="questionText" class="question"></h2>
                                    <div id="answersContainer" class="row g-2"></div>
                                </div>

                                <div class="text-center">
                                    <button id="nextBtn" class="btn btn-dark btn-lg" disabled>Selanjutnya</button>
                                </div>
                            </section>

                            <!-- Result Screen -->
                            <section id="resultScreen" class="screen">
                                <header class="text-center mb-4">
                                    <h1 class="title">Hasil Kuis</h1>
                                </header>
                                
                                <div class="score-container text-center">
                                    <div class="score-circle mx-auto">
                                        <span id="finalScore" class="score-number">0</span>
                                        <span class="score-label">/ 10</span>
                                    </div>
                                    <div id="alertContainer"></div>
                                    <p id="scoreMessage" class="score-message"></p>
                                </div>
                                
                                <div class="text-center">
                                    <button id="restartBtn" class="btn btn-dark btn-lg">Ulangi Kuis</button>
                                </div>
                            </section>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer bg-dark text-white text-center py-3 mt-5">
        <div class="container">
            <p class="mb-0">Terima Kasih sudah berkunjung!</p>
        </div>
    </footer>

    <!-- Modal untuk konfirmasi -->
    <div class="modal fade" id="confirmModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Konfirmasi</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p id="modalMessage"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="button" class="btn btn-dark" id="confirmBtn">Ya, Lanjutkan</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
